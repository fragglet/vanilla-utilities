name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:  # Weekly build
    - cron: "15 3 * * 1"

jobs:
  watcom_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt -q install dosbox dos2unix
    - name: build
      timeout-minutes: 20
      run: |
        ./build/watbuild.sh
        ./mkrelease.sh
    - name: rebuild build utilities
      timeout-minutes: 20
      run: |
        ./build/watbuild.sh build-utils
    - name: test
      run: ./test/runtests.sh
      timeout-minutes: 20
    - name: Find Git version
      id: version
      run: |
        if git describe --exact-match --tags >/dev/null; then
          VERSION=$(git describe --exact-match --tags)
          VERSION=${VERSION/#v/}
        else
          VERSION=$(git rev-parse --short HEAD)
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
    - name: Upload EXEs
      uses: actions/upload-artifact@v6
      with:
        path: "dist"
        name: vanilla-utilities-${{steps.version.outputs.VERSION}}

  turboc_build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt -q install dosbox
    - name: build
      timeout-minutes: 20
      run: |
        ./build/tcbuild.sh
    - name: test
      run: ./test/runtests.sh
      timeout-minutes: 20
